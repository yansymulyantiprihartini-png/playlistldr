<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDR Playlist - Lana Del Rey</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Arial', sans-serif; }
body { background:#121212; color:#fff; display:flex; height:100vh; overflow:hidden; }

/* Sidebar */
.sidebar { width:240px; background:#000; padding:20px; overflow-y:auto; }
.sidebar h2 { color:#C9A961; margin-bottom:20px; font-size:24px; }
.album-list { display:flex; flex-direction:column; gap:15px; }
.album-item { display:flex; gap:10px; align-items:center; cursor:pointer; padding:8px; border-radius:5px; }
.album-item:hover { background:#1A1A1A; }
.album-item img { width:50px; height:50px; object-fit:cover; border-radius:4px; }

/* Main Content */
.main { flex:1; padding:30px; overflow-y:auto; background:linear-gradient(#3a2f1a, #121212); }
.main h1 { font-size:32px; margin-bottom:20px; color:#C9A961; }
.song-list { display:flex; flex-direction:column; gap:10px; }
.song { display:flex; justify-content:space-between; padding:12px; background:#181818; border-radius:5px; cursor:pointer; }
.song:hover { background:#282828; }
.song.active { background:#C9A961; color:#000; }

/* Player */
.player { position:fixed; bottom:0; left:0; right:0; height:90px; background:#181818; border-top:1px solid #282828; display:flex; align-items:center; padding:0 20px; gap:20px; }
.player-info { display:flex; align-items:center; gap:15px; width:250px; }
.player-info img { width:56px; height:56px; border-radius:4px; }
.controls { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
.buttons { display:flex; gap:20px; align-items:center; }
.buttons button { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; }
.buttons button.play { font-size:32px; color:#C9A961; }
.progress { width:100%; display:flex; align-items:center; gap:10px; font-size:12px; color:#b3b3b3; }
.progress input { flex:1; accent-color:#C9A961; }
.volume { width:120px; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>💿 LDR Playlist</h2>
  <div class="album-list" id="albumList"></div>
</div>

<div class="main">
  <h1 id="albumTitle">Pilih Album</h1>
  <div class="song-list" id="songList"></div>
</div>

<div class="player">
  <div class="player-info">
    <img id="nowImg" src="https://i.scdn.co/image/ab67616d0000b273700f6bdfb5b4c4b2b5b5b5b5" alt="">
    <div>
      <div id="nowTitle">-</div>
      <div id="nowArtist" style="font-size:12px; color:#b3b3b3;">Lana Del Rey</div>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button onclick="prevSong()">⏮</button>
      <button class="play" onclick="playPause()">▶</button>
      <button onclick="nextSong()">⏭</button>
    </div>
    <div class="progress">
      <span id="currentTime">0:00</span>
      <input type="range" id="progressBar" value="0">
      <span id="duration">0:00</span>
    </div>
  </div>

  <input type="range" class="volume" id="volumeBar" min="0" max="1" step="0.1" value="0.7">
</div>

<audio id="audio"></audio>
